<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101916">
  <title>CUBE / ルービックキューブタイマー</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main>
    <header><a class="brand" href="./" aria-label="CUBE ホーム"><span class="cube">▦</span> CUBE<span class="brand-note">SOLVE. REPEAT.</span></a><span class="session"><i></i> セッション</span></header>
    <section class="intro"><span class="eyebrow">YOUR NEXT PERSONAL BEST</span><h1>ひとつずつ、速くなる。</h1><p>集中して、回して、タップ。</p></section>
    <button id="timer" class="timer" type="button" aria-label="タップして計測開始">
      <span id="status" class="timer-status"><i></i> READY TO SOLVE</span>
      <span id="time" class="time">0<span>.00</span></span>
      <span id="hint" class="hint"><span class="tap-icon">◎</span> 画面をタップしてスタート</span>
      <span class="keyboard">スペースキーでも操作できます</span>
    </button>
    <div id="announcement" class="sr-only" aria-live="polite"></div>
    <section class="stats" aria-label="統計">
      <div class="stat featured"><span>直近5回の平均 <b>Ao5</b></span><strong id="average">—</strong><small id="average-note">あと5回で表示</small></div>
      <div class="stat"><span>ベストタイム</span><strong id="best">—</strong><small>PERSONAL BEST</small></div>
      <div class="stat"><span>計測回数</span><strong id="count">0<em>回</em></strong><small>TOTAL SOLVES</small></div>
    </section>
    <section class="history"><div class="section-heading"><h2>計測の記録 <span id="history-count">0</span></h2><button id="clear" type="button" disabled>すべて削除</button></div>
      <div class="table-heading"><span>NO. / 日時</span><span>タイム</span><span class="delete-heading">削除</span></div>
      <ol id="records"></ol>
      <div id="empty" class="empty"><span>◷</span><h3>最初の記録をつくろう</h3><p>タイマーをタップすると、ここに記録が残ります。</p></div>
      <p class="storage-note" id="storage-note">記録はこのブラウザに自動保存されます。</p>
    </section>
    <footer><span>CUBE TIMER</span><p>Ao5 は直近5回の最速・最遅を除いた3回の平均です。</p></footer>
  </main>
</body>
</html>
